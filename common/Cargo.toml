[package]
name = "minui_common"
version = "0.1.0"
edition = "2021"
description = "Shared screen, input and on-screen keyboard code for the Rust MinUI paks"

[dependencies]
font8x8 = "0.3"
# Renders MinUI's own font (BPreplay, loaded from the SD card at runtime).
fontdue = "0.9"
# Only used for the desktop preview window.
minifb = { version = "0.27", optional = true }

[features]
default = []
desktop = ["dep:minifb"]
