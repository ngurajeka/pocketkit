[package]
name = "pocketkit_platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "pocketkit platforms: desktop preview, MinUI (Miyoo Mini+), muOS (RG35XX-SP)"

[dependencies]
pocketkit_core = { path = "../core" }
# Framebuffer ioctls (vsync-timed page flips). Plain bindings, fine for static musl.
libc = "0.2"
minifb = { version = "0.27", optional = true }

[features]
default = []
desktop = ["dep:minifb"]
minui = []
muos = []
