name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      # Everything runs in the repo's dev shell, so CI uses the same toolchains
      # (Rust targets, rust-lld/clang, the Miyoo toolchain) as local builds.
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: nix develop --command cargo test --workspace
      - name: Build every app for every platform
        run: nix develop --command ./package.sh
