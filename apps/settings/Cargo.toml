[package]
name = "settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Settings for MinUI on the Miyoo Mini+ and for pocketkit apps"

[dependencies]
pocketkit_core = { path = "../../crates/core" }
pocketkit_platform = { path = "../../crates/platform" }

[features]
default = ["desktop"]
desktop = ["pocketkit_platform/desktop"]
minui = ["pocketkit_platform/minui"]
muos = ["pocketkit_platform/muos"]
