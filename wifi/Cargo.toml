[package]
name = "wifi"
version = "0.1.0"
edition = "2021"
description = "Wi-Fi network picker for the Miyoo Mini+ (MinUI)"

[dependencies]
minui_common = { path = "../common" }

[features]
default = ["desktop"]
# Desktop preview uses a simulated Wi-Fi backend.
desktop = ["minui_common/desktop"]
device = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
