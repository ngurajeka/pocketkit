[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "apps/web-browser",
    "apps/music",
    "apps/wifi",
    "apps/settings",
    "apps/pocket-pet",
]

[workspace.package]
license = "MIT"
edition = "2021"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
